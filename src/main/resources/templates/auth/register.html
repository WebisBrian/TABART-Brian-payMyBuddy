<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
            pageTitle='Inscription - Pay My Buddy',
            navbar=~{},
            content=~{::content}
      )}">
<body>

<div th:fragment="content" class="container">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-10 col-sm-8 col-md-5 col-lg-4">

            <div class="d-flex flex-column align-items-center"
                 style="min-height: 70vh; justify-content: center;">

                <div class="border bg-white p-4"
                     style="width: 100%; max-width: 360px;">

                    <h1 class="visually-hidden">S'inscrire</h1>

                    <div class="text-center mb-4">
                        <span class="brand-badge">Pay My Buddy</span>
                    </div>

                    <form th:action="@{/register}"
                          th:object="${registerForm}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label visually-hidden">
                                Nom d'utilisateur
                            </label>

                            <input id="username"
                                   type="text"
                                   th:field="*{username}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   th:attr="aria-invalid=${#fields.hasErrors('username')} ? 'true' : 'false',
                                            aria-describedby=${#fields.hasErrors('username')} ? 'username-error' : null"
                                   placeholder="Nom d'utilisateur"
                                   autocomplete="username"
                                   required>

                            <div id="username-error"
                                 class="mt-1 text-danger small"
                                 th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label visually-hidden">
                                Email
                            </label>

                            <input id="email"
                                   type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : 'false',
                                            aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null"
                                   placeholder="Email"
                                   autocomplete="email"
                                   required>

                            <div id="email-error"
                                 class="mt-1 text-danger small"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label visually-hidden">
                                Mot de passe
                            </label>

                            <input id="password"
                                   type="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : 'false',
                                            aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : null"
                                   placeholder="Mot de passe"
                                   autocomplete="new-password"
                                   required>

                            <div id="password-error"
                                 class="mt-1 text-danger small"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary-custom px-4">
                                S'inscrire
                            </button>
                        </div>

                    </form>

                </div>

                <div class="mt-4 text-center">
                    <a th:href="@{/login}">
                        Déjà inscrit ? Connectez-vous !
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
