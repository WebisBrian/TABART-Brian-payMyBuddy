<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
            pageTitle='Transférer - Pay My Buddy',
            navbar=~{fragments/navbar :: navbar},
            content=~{::content}
      )}">
<body>

<div th:fragment="content" class="container">

    <!-- Page title badge -->
    <div class="my-4">
        <span class="brand-badge">Transfer</span>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Send money block -->
    <div class="bg-white border p-4 mb-4">
        <form th:action="@{/transactions/transfer(userId=${param.userId})}"
              th:object="${transferForm}"
              method="post"
              class="row g-3 align-items-start"
              novalidate>

            <!-- Contact select -->
            <div class="col-12 col-md-5">
                <label for="receiverId" class="form-label visually-hidden">Sélectionner une relation</label>
                <select id="receiverId"
                        class="form-select"
                        th:field="*{receiverId}"
                        required>
                    <option value="" selected disabled>Sélectionner une relation</option>
                    <option th:each="c : ${contacts}"
                            th:value="${c.id}"
                            th:text="|${c.username} (${c.email})|">
                    </option>
                </select>

                <div class="mt-1 text-danger small" th:if="${#fields.hasErrors('receiverId')}">
                    <span th:errors="*{receiverId}">Erreur destinataire</span>
                </div>
            </div>

            <!-- Description -->
            <div class="col-12 col-md-4">
                <label for="description" class="form-label visually-hidden">Description</label>
                <input id="description"
                       type="text"
                       class="form-control"
                       th:field="*{description}"
                       placeholder="Description"
                       maxlength="140">
                <div class="mt-1 text-danger small" th:if="${#fields.hasErrors('description')}">
                    <span th:errors="*{description}">Erreur description</span>
                </div>
            </div>

            <!-- Amount -->
            <div class="col-12 col-md-2">
                <label for="amount" class="form-label visually-hidden">Montant</label>
                <input id="amount"
                       type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       placeholder="0.00"
                       th:field="*{amount}"
                       required>

                <div class="mt-1 text-danger small" th:if="${#fields.hasErrors('amount')}">
                    <span th:errors="*{amount}">Erreur montant</span>
                </div>
            </div>

            <!-- Submit -->
            <div class="col-12 col-md-1 d-grid">
                <button type="submit" class="btn btn-primary-custom">
                    Payer
                </button>
            </div>

        </form>
    </div>

    <!-- Transactions table -->
    <div class="bg-white border p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Relation</th>
                    <th scope="col">Type</th>
                    <th scope="col">Description</th>
                    <th scope="col" class="text-end">Montant</th>
                    <th scope="col" class="text-end">Frais</th>
                </tr>
                </thead>

                <tbody>
                <!-- Empty state -->
                <tr th:if="${transactionRows == null || transactionRows.content == null || transactionRows.content.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Aucune transaction
                    </td>
                </tr>

                <!-- Rows -->
                <tr th:each="row : ${transactionRows.content}">
                    <td th:text="${row.date}">2026-01-01T12:00</td>
                    <td th:text="${row.counterpartyLabel}">Alice (alice@mail.com)</td>
                    <td th:text="${row.directionLabel}">Envoyé</td>
                    <td th:text="${row.description}">Description</td>

                    <td class="text-end fw-semibold"
                        th:text="${row.signedAmount}"
                        th:classappend="${row.signedAmount.signum() < 0} ? 'text-danger' : 'text-success'">
                        -15.00
                    </td>

                    <td class="text-end"
                        th:text="${row.direction.name() == 'SENT' ? row.fee : '—'}">
                        0.00
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav class="mt-3" th:if="${transactionRows != null}">
            <ul class="pagination justify-content-center mb-0">

                <li class="page-item" th:classappend="${!transactionRows.hasPrevious()} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/transactions(userId=${param.userId}, page=${transactionRows.number - 1}, size=${transactionRows.size})}"
                       aria-label="Précédent">
                        Précédent
                    </a>
                </li>

                <li class="page-item disabled">
                    <span class="page-link"
                          th:text="${transactionRows.totalPages == 0
                                ? '0 / 0'
                                : (transactionRows.number + 1) + ' / ' + transactionRows.totalPages}">
                        1 / 1
                    </span>
                </li>

                <li class="page-item" th:classappend="${!transactionRows.hasNext()} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/transactions(userId=${param.userId}, page=${transactionRows.number + 1}, size=${transactionRows.size})}"
                       aria-label="Suivant">
                        Suivant
                    </a>
                </li>

            </ul>
        </nav>
    </div>

</div>

</body>
</html>
