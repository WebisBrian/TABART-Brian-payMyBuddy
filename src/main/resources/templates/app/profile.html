<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
            pageTitle='Profil - Pay My Buddy',
            navbar=~{fragments/navbar :: navbar},
            content=~{::content}
      )}">
<body>

<div th:fragment="content" class="container">

    <!-- Flash alerts -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <h1 class="h3 text-center shadow p-2 mb-5 rounded orange-background text-light w-50 mx-auto">Mon profil</h1>

    <div class="bg-white border p-4">

        <form th:action="@{/profile/update}"
              th:object="${profileForm}"
              method="post"
              class="row g-3"
              >

            <!-- Username -->
            <div class="col-12">
                <label for="newUsername" class="form-label">Nom d’utilisateur</label>
                <input id="newUsername"
                       type="text"
                       class="form-control"
                       th:field="*{newUsername}"
                       th:attr="aria-invalid=${#fields.hasErrors('newUsername')} ? 'true' : 'false'"
                       th:attrappend="aria-describedby=${#fields.hasErrors('newUsername') ? 'newUsername-error' : null}"
                       th:classappend="${#fields.hasErrors('newUsername')} ? 'is-invalid' : ''"
                       placeholder="Nom d’utilisateur"
                       autocomplete="username"
                       required>

                <div id="newUsername-error"
                     class="mt-1 text-danger small"
                     th:if="${#fields.hasErrors('newUsername')}"
                     th:errors="*{newUsername}">
                </div>
            </div>

            <!-- Email -->
            <div class="col-12">
                <label for="newEmail" class="form-label">Email</label>
                <input id="newEmail"
                       type="email"
                       class="form-control"
                       th:field="*{newEmail}"
                       th:attr="aria-invalid=${#fields.hasErrors('newEmail')} ? 'true' : 'false'"
                       th:attrappend="aria-describedby=${#fields.hasErrors('newEmail') ? 'newEmail-error' : null}"
                       th:classappend="${#fields.hasErrors('newEmail')} ? 'is-invalid' : ''"
                       placeholder="email@example.com"
                       autocomplete="email"
                       required>

                <div id="newEmail-error"
                     class="mt-1 text-danger small"
                     th:if="${#fields.hasErrors('newEmail')}"
                     th:errors="*{newEmail}">
                </div>
            </div>

            <!-- Submit -->
            <div class="col-12 d-grid d-sm-flex justify-content-sm-end">
                <button type="submit" class="btn btn-primary-custom px-4">
                    Mettre à jour le profil
                </button>
            </div>

        </form>

        <hr class="my-4"/>

        <form th:action="@{/profile/password}"
              th:object="${changePasswordForm}"
              method="post"
              class="row g-3"
              >

            <!-- Current password -->
            <div class="col-12">
                <label for="currentPassword" class="form-label">Mot de passe actuel</label>
                <input id="currentPassword"
                       type="password"
                       class="form-control"
                       th:field="*{currentPassword}"
                       th:attr="aria-invalid=${#fields.hasErrors('currentPassword')} ? 'true' : 'false'"
                       th:attrappend="aria-describedby=${#fields.hasErrors('currentPassword') ? 'currentPassword-error' : null}"
                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                       autocomplete="current-password"
                       required>

                <div id="currentPassword-error"
                     class="mt-1 text-danger small"
                     th:if="${#fields.hasErrors('currentPassword')}"
                     th:errors="*{currentPassword}">
                </div>
            </div>

            <!-- New password -->
            <div class="col-12">
                <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                <input id="newPassword"
                       type="password"
                       class="form-control"
                       th:field="*{newPassword}"
                       th:attr="aria-invalid=${#fields.hasErrors('newPassword')} ? 'true' : 'false'"
                       th:attrappend="aria-describedby=${#fields.hasErrors('newPassword') ? 'newPassword-error' : null}"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                       autocomplete="new-password"
                       required>

                <div id="newPassword-error"
                     class="mt-1 text-danger small"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                </div>
            </div>

            <!-- Confirm a new password -->
            <div class="col-12">
                <label for="confirmNewPassword" class="form-label">Confirmer le nouveau mot de passe</label>
                <input id="confirmNewPassword"
                       type="password"
                       class="form-control"
                       th:field="*{confirmNewPassword}"
                       th:attr="aria-invalid=${#fields.hasErrors('confirmNewPassword')} ? 'true' : 'false'"
                       th:attrappend="aria-describedby=${#fields.hasErrors('confirmNewPassword') ? 'confirmNewPassword-error' : null}"
                       th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'is-invalid' : ''"
                       autocomplete="new-password"
                       required>

                <div id="confirmNewPassword-error"
                     class="mt-1 text-danger small"
                     th:if="${#fields.hasErrors('confirmNewPassword')}"
                     th:errors="*{confirmNewPassword}">
                </div>
            </div>

            <!-- Submit -->
            <div class="col-12 d-grid d-sm-flex justify-content-sm-end">
                <button type="submit" class="btn btn-primary-custom px-4">
                    Modifier le mot de passe
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
