<!doctype html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(
            pageTitle='404 - Pay My Buddy',
            navbar=~{fragments/navbar :: navbar},
            content=~{::content}
      )}">
<body>

<div th:fragment="content" class="container">

    <!-- Page title badge (same style as your authenticated pages) -->
    <h2 class="h2 text-center shadow p-2 mb-5 rounded orange-background text-light w-50 mx-auto">
        Page introuvable
    </h2>

    <!-- Alerts (if you use them globally) -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Main block -->
    <div class="bg-white border p-4 text-center">
        <p class="text-muted mb-3"
           th:text="${errorMessage != null ? errorMessage : 'La page demandée est introuvable.'}">
            La page demandée est introuvable.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <!-- Primary action: back to app home for authenticated users -->
            <a class="btn btn-primary-custom" th:href="@{/transactions}">
                Retour aux transactions
            </a>

            <!-- Secondary action: go back in browser history -->
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                Page précédente
            </button>
        </div>
    </div>

</div>

</body>
</html>
