name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs :
  build-test:
    name: Build & Test (Maven, Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1) Retrieve the repository code from the GitHub runner
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Install Java 21 and enable the Maven cache (speeds up builds)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3) (Optional) Displays the Maven/Java version for debugging
      - name: Show Java & Maven versions
        run: |
          java -version
          mvn -version


      # 4) Run the full Maven verification (compile + tests)
      # -B = batch mode (cleaner output for CI)
      - name: Build and test
        run: mvn -B verify